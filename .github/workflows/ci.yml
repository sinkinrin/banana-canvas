name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b12 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: npm
      - name: Read Electron tool versions
        id: electron-tools
        shell: bash
        run: node -e "const p=require('./package-lock.json').packages; console.log('key='+p['node_modules/electron'].version+'-'+p['node_modules/electron-builder'].version)" >> "$GITHUB_OUTPUT"
      - name: Cache Electron runtime and builder tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-tools-${{ runner.os }}-${{ runner.arch }}-ci-${{ steps.electron-tools.outputs.key }}
      - run: npm ci
      - run: npm run check
      - if: runner.os == 'Linux'
        run: npm audit --audit-level=high
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:electron
      - if: runner.os == 'Windows'
        env:
          BANANA_SKIP_CUTOUT_INFERENCE: '1'
        run: npm run smoke:electron
